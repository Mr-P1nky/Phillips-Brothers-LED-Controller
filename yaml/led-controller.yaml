# Phillips Brothers LED Controller v1.1
# ESP32-S3-Zero based LED strip controller for Home Assistant
# 9 button inputs via ESPHome
# SPDX-License-Identifier: GPL-3.0-or-later
# Copyright (c) 2026 Mr-P1nky
substitutions:
  device_name: led-controller
  friendly_name: "LED Controller"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  project:
    name: "Phillips Brothers.LED Controller"
    version: "1.1"

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  framework:
    type: esp-idf

# ESP32-S3FH4R2 has 2MB of in-package quad PSRAM.
# Gives the BLE proxy headroom for concurrent connections.
psram:
  mode: quad
  speed: 80MHz

logger:
  level: WARN

api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    password: !secret ota_password

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  # Fallback hotspot so the device stays reachable if the
  # configured network changes or goes away. Avoids a USB reflash.
  ap:
    ssid: "LED Controller Setup"
    password: !secret ap_password

captive_portal:

web_server:
  port: 80
  version: 3

bluetooth_proxy:
  active: true

button:
  - platform: restart
    name: "Restart"
    entity_category: config

sensor:
  - platform: internal_temperature
    name: "ESP32 Temperature"
    update_interval: 60s

  - platform: wifi_signal
    name: "WiFi Signal"
    update_interval: 60s
    entity_category: diagnostic

binary_sensor:
  - platform: gpio
    pin:
      number: GPIO5
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Power button"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

  - platform: gpio
    pin:
      number: GPIO4
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Bright up button"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

  - platform: gpio
    pin:
      number: GPIO6
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Bright down button"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

  - platform: gpio
    pin:
      number: GPIO2
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Rainbow button"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

  - platform: gpio
    pin:
      number: GPIO1
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Random button"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

  - platform: gpio
    pin:
      number: GPIO7
      mode:
        input: true
        pullup: true
      inverted: true
    name: "White cycle button"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

  - platform: gpio
    pin:
      number: GPIO8
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Red button"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

  - platform: gpio
    pin:
      number: GPIO9
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Green button"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms

  - platform: gpio
    pin:
      number: GPIO10
      mode:
        input: true
        pullup: true
      inverted: true
    name: "Blue button"
    filters:
      - delayed_on: 10ms
      - delayed_off: 10ms
